<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Jungle Adventure with Slopes</title>
    <style>
        body { margin: 0; overflow: hidden; background: #2E8B57; }
        canvas { display: block; }
        .game-over { color: white; font-size: 30px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; }
    </style>
</head>
<body>
    <div id="gameOverText" class="game-over">Game Over! Press Space to Restart</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, player, ground, obstaclesGroup, gameOver = false, score = 0;
        let leftPressed = false, rightPressed = false, jumpPressed = false, velocity = 0;
        let terrainWidth = 100, terrainHeight = 100, terrainData = [];

        // Initialize scene, camera, and renderer
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Create random terrain with slopes
            generateTerrain();

            // Player (simple cube for now)
            const playerGeometry = new THREE.BoxGeometry(1, 1, 1);
            const playerMaterial = new THREE.MeshBasicMaterial({ color: 0x8B4513 });
            player = new THREE.Mesh(playerGeometry, playerMaterial);
            player.position.set(0, 1, 10);
            scene.add(player);

            // Obstacles group
            obstaclesGroup = new THREE.Group();
            scene.add(obstaclesGroup);

            camera.position.z = 50;
            camera.position.y = 10;

            // Controls
            document.addEventListener('keydown', (e) => {
                if (e.code === 'ArrowLeft') leftPressed = true;
                if (e.code === 'ArrowRight') rightPressed = true;
                if (e.code === 'Space' && !jumpPressed) jumpPressed = true;
            });

            document.addEventListener('keyup', (e) => {
                if (e.code === 'ArrowLeft') leftPressed = false;
                if (e.code === 'ArrowRight') rightPressed = false;
                if (e.code === 'Space') jumpPressed = false;
            });

            // Start the game loop
            animate();
        }

        // Generate terrain with random slopes using noise
        function generateTerrain() {
            const geometry = new THREE.PlaneGeometry(terrainWidth, terrainHeight, terrainWidth - 1, terrainHeight - 1);
            const vertices = geometry.attributes.position.array;

            // Simple random height generation for slopes
            for (let i = 0; i < vertices.length; i += 3) {
                let x = vertices[i];
                let z = vertices[i + 2];
                let height = Math.sin(x * 0.1) * 3 + Math.cos(z * 0.1) * 3 + Math.random() * 2;
                vertices[i + 1] = height; // Set the Y position (height) of each vertex
            }

            const material = new THREE.MeshBasicMaterial({ color: 0x228B22, side: THREE.DoubleSide, wireframe: true });
            ground = new THREE.Mesh(geometry, material);
            ground.rotation.x = - Math.PI / 2;
            scene.add(ground);
        }

        // Create an obstacle (simple cylinder for now)
        function createObstacle() {
            const geometry = new THREE.CylinderGeometry(0.5, 0.5, 2, 8);
            const material = new THREE.MeshBasicMaterial({ color: 0x654321 });
            const obstacle = new THREE.Mesh(geometry, material);
            obstacle.position.set(Math.random() * 20 - 10, 1, Math.random() * -100 - 10);
            obstaclesGroup.add(obstacle);
        }

        // Move player and handle movement along the slope
        function movePlayer() {
            if (leftPressed) player.position.x -= 0.1;
            if (rightPressed) player.position.x += 0.1;

            // Jump mechanic
            if (jumpPressed && player.position.y <= 1) {
                velocity = 0.1;
            }

            // Apply gravity and adjust Y position based on terrain
            player.position.y += velocity;
            let terrainHeight = getTerrainHeight(player.position.x, player.position.z);
            if (player.position.y <= terrainHeight + 1) {
                player.position.y = terrainHeight + 1;
                velocity = 0;
            } else {
                velocity -= 0.01;
            }
        }

        // Get terrain height at specific X,Z coordinates
        function getTerrainHeight(x, z) {
            let terrainX = Math.floor(x + terrainWidth / 2);
            let terrainZ = Math.floor(z + terrainHeight / 2);
            if (terrainX < 0 || terrainX >= terrainWidth || terrainZ < 0 || terrainZ >= terrainHeight) {
                return 0;
            }
            return terrainData[terrainX + terrainZ * terrainWidth];
        }

        // Move obstacles
        function moveObstacles() {
            obstaclesGroup.children.forEach((obstacle, index) => {
                obstacle.position.z += 0.1;
                if (obstacle.position.z > 10) {
                    obstaclesGroup.remove(obstacle);
                }
            });
        }

        // Collision detection
        function checkCollisions() {
            obstaclesGroup.children.forEach(obstacle => {
                const dist = player.position.distanceTo(obstacle.position);
                if (dist < 1.5) {
                    gameOver = true;
                    document.getElementById('gameOverText').style.display = 'block';
                }
            });
        }

        // Animation loop
        function animate() {
            if (gameOver) return;

            movePlayer();
            moveObstacles();
            checkCollisions();

            if (Math.random() < 0.02) createObstacle();  // Randomly create obstacles

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // Restart the game
        function resetGame() {
            gameOver = false;
            player.position.set(0, 1, 10);
            obstaclesGroup.clear();
            score = 0;
            document.getElementById('gameOverText').style.display = 'none';
            animate();
        }

        // Key press for restart
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && gameOver) {
                resetGame();
            }
        });

        init();
    </script>
</body>
</html>
